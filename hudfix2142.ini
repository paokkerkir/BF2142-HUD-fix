# BF2142 widescreen HUD fix - layout for the vanilla 1.51 HUD
# (a client-side port of the "HUD fix" Menu_server/Shaders_client mod).
# The HUD is squeezed into the centre 4:3 area; nodes listed below are then
# pushed out to the screen edges by however much extra width the screen has.
#
#   make_movable <node>            create a SplitNode as a TransformNode so it can be moved
#   offset_left/right <node>       anchor node to the left/right screen edge
#   override_parent <node> <new>   create node under a different parent
#   clone <node> <new>             also create TransformNode <new> with node's parent/rect
#   rect <node> x y w h            replace the node's position/size from the HUD scripts
#   hide <node>                    create the node with zero size
#   fill_left/right, keep_stretched  as in the BF2 version
#   offset_minimap 0/1             move the minimap with the right edge
#   fix_crosshair 0/1              crosshair jitter fix when going prone
#   fov_scale <f>                  multiply the game FOV (1.0 = unchanged)
#   resolution <w> <h>             only if auto-detection picks the wrong size (see hudfix2142.log)
#   log 0/1                        write hudfix2142.log next to the DLL

# --- bottom corners (health / ammo)
make_movable BottomRightStaticHud
make_movable BottomLeftStaticHud
offset_right BottomRightStaticHud
offset_left  BottomLeftStaticHud
offset_left  BottomLeftBar

# --- squad info, chat, player names, weapon selection
make_movable SquadInfo
make_movable SquadOrderInfo
make_movable IngameChat
make_movable IngameChatInput
offset_left  SquadInfo
offset_left  SquadOrderInfo
offset_left  IngameChat
offset_left  IngameChatInput
offset_left  PlayerNames
offset_right ItemSelectionHud

# --- minimap (top right)
make_movable MinSizeAlpha
offset_right MinSizeAlpha
offset_minimap 1

# --- commander screen
hide CommanderHudLeftBorder
hide CommanderHudRightBorder

make_movable CommanderInterfaceLeft
offset_left  CommanderInterfaceLeft
clone CommanderInterfaceLeft CommanderInterfaceMiddle
clone CommanderInterfaceLeft CommanderInterfaceMiddleTitan
rect  CommanderInterfaceMiddle -104 0 800 600
rect  CommanderInterfaceMiddleTitan 0 0 800 600

override_parent TicketTimerInfoConquestMode CommanderInterfaceMiddle
override_parent TicketInfoTitansBaseSplitNodeCommanderMode CommanderInterfaceMiddleTitan

override_parent CommanderSquadTabSelected CommanderInterfaceLeft
override_parent CommanderSquadTabUnselected CommanderInterfaceLeft
override_parent CommanderSquadMemberList CommanderInterfaceLeft
rect CommanderSquadTabSelected 53 0 182 175
rect CommanderSquadTabUnselected 53 -151 182 175
rect CommanderSquadMemberList 231 0 213 157
rect CommanderSquadTabButtonSelected 0 150 200 25
rect CommanderSquadTabButtonUnselected 0 150 200 25
rect CommanderSquadsLabel 92 153 80 23
rect CommanderSquadsLabelUnselected 92 153 80 23
rect CommanderMapTabButtonSelected 0 168 201 17
rect CommanderMapLabel 12 167 135 112

fix_crosshair 1
fov_scale 1.0
log 1
